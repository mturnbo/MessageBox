version: 2

updates:
  - package-ecosystem: uv
    directory: /apps/api-python
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/api-node
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/frontend-react
    schedule:
      interval: weekly
    ignore:
      # primereact 11+ is under the PrimeUI License (license key required)
      - dependency-name: primereact
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/frontend-angular
    schedule:
      interval: weekly
    ignore:
      # primeng 22+ is under the PrimeUI License (license key required) and pins Angular majors
      - dependency-name: primeng
        update-types: [version-update:semver-major]
      - dependency-name: "@angular/*"
        update-types: [version-update:semver-major]
      # @primeuix/themes 3+ is under the PrimeUI License (license key required)
      - dependency-name: "@primeuix/themes"
        update-types: [version-update:semver-major]
      # @angular/build 21 requires typescript >=5.9 <6.0 and vitest ^4
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /apps/api-go
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
