name: frontend-angular

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend-angular/**"
      - ".github/workflows/frontend-angular.yml"
  pull_request:
    paths:
      - "apps/frontend-angular/**"
      - ".github/workflows/frontend-angular.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/frontend-angular

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend-angular/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm audit --audit-level=high --omit=dev
