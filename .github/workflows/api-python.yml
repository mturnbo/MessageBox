name: api-python

on:
  push:
    branches: [main]
    paths:
      - "apps/api-python/**"
      - ".github/workflows/api-python.yml"
  pull_request:
    paths:
      - "apps/api-python/**"
      - ".github/workflows/api-python.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/api-python

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen --extra dev ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --frozen pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv export --frozen --no-emit-project -o requirements-audit.txt
      - run: uvx pip-audit -r requirements-audit.txt --disable-pip
