[project]
name = "messagebox-api-python"
author = "Marcus E. Turnbo"
version = "1.1.0"
description = "FastAPI for MessageBox"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "annotated-doc==0.0.6",
    "annotated-types==0.8.0",
    "anyio>=4.14.2",
    "asgi-correlation-id>=5.0.1",
    "bcrypt>=5.0.0",
    "certifi>=2026.10.18",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "click==8.5.1",
    "cryptography>=50.0.0",
    "dnspython>=2.9.2",
    "docopt==0.6.2",
    "email-validator==2.4.0",
    "fastapi>=0.130.0",
    "fastapi-cli==0.0.14",
    "fastapi-cloud-cli==0.3.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httptools==0.9.0",
    "httpx==0.28.1",
    "idna>=3.15",
    "jinja2==3.1.6",
    "markdown-it-py==4.3.0",
    "markupsafe==3.0.4",
    "mdurl==0.1.2",
    "mysql-connector-python==9.5.0",
    "pipreqs==0.4.13",
    "pycparser==2.23",
    "pydantic==2.12.3",
    "pydantic-core==2.41.4",
    "pygments>=2.20.0",
    "pyjwt>=2.15.0",
    "pymysql==1.2.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
    "pyyaml==6.0.3",
    "requests>=2.33.0",
    "rich==14.2.0",
    "rich-toolkit==0.20.6",
    "rignore==0.8.1",
    "sentry-sdk==2.75.0",
    "shellingham==1.5.4",
    "slowapi>=0.1.10",
    "sniffio==1.3.1",
    "sqlalchemy==2.0.44",
    "sqlmodel==0.0.50",
    "starlette>=1.3.1",
    "structlog>=26.1.0",
    "typer==0.29.1",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.5",
    "urllib3>=2.8.0",
    "uvicorn==0.54.0",
    "uvloop==0.23.0",
    "watchfiles==1.3.0",
    "websockets==15.0.1",
    "yarg==0.1.10",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
messagebox-api = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]
"alembic/env.py" = ["E402"]
